name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-native-linux:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PS2DEV: /home/runner/ps2dev-native
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential texinfo bison flex autoconf automake libtool \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev zip
      - name: Build IOP
        working-directory: iop
        run: bash build.sh
      - name: Build EE
        working-directory: ee
        run: bash build.sh
      - name: Bundle licenses
        run: |
          scripts/bundle-licenses.sh "$GITHUB_WORKSPACE/build" "$PS2DEV/LICENSES"
          cp LICENSE "$PS2DEV/LICENSE"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-toolchain
          path: ${{ env.PS2DEV }}
          retention-days: 1

  package-linux:
    if: false
    needs: build-native-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-toolchain
          path: ${{ runner.temp }}/ps2dev
      - name: Restore executable permissions
        run: scripts/restore-exec-bits.sh "${{ runner.temp }}/ps2dev"
      - name: Package
        run: |
          name="ps2-toolchain-${GITHUB_REF_NAME#v}-linux-amd64"
          mkdir -p "${{ runner.temp }}/staging/toolchain"
          mv "${{ runner.temp }}"/ps2dev/* "${{ runner.temp }}/staging/toolchain/"
          (cd "${{ runner.temp }}/staging" && zip -rq "$GITHUB_WORKSPACE/$name.zip" toolchain)
      - uses: softprops/action-gh-release@v2
        with:
          files: ps2-toolchain-*-linux-amd64.zip

  build-windows-cross:
    if: false
    needs: build-native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PS2DEV: /home/runner/ps2dev-win
      NATIVE: /home/runner/ps2dev-native
      PS2_CROSS_HOST: x86_64-w64-mingw32
      PS2_NATIVE_EE_TOOLS: /home/runner/ps2dev-native/ee
      PS2_NATIVE_IOP_TOOLS: /home/runner/ps2dev-native/iop
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential texinfo bison flex autoconf automake libtool \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev curl ca-certificates \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools zip
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-toolchain
          path: ${{ env.NATIVE }}
      - name: Restore executable permissions
        run: scripts/restore-exec-bits.sh "$NATIVE"
      - name: Build EE
        working-directory: ee
        run: |
          mkdir -p "$PS2DEV/ee"
          cp -r "$NATIVE/ee/mips64r5900el-ps2-elf" "$PS2DEV/ee/mips64r5900el-ps2-elf"
          bash build.sh 1 6
      - name: Build IOP
        working-directory: iop
        run: bash build.sh 1 2
      - name: Bundle licenses
        run: |
          scripts/bundle-licenses.sh "$GITHUB_WORKSPACE/build" "$PS2DEV/LICENSES"
          cp LICENSE "$PS2DEV/LICENSE"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cross-toolchain
          path: ${{ env.PS2DEV }}
          retention-days: 1

  package-windows:
    if: false
    needs: build-windows-cross
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-toolchain
          path: ${{ runner.temp }}/staging/toolchain
      - name: Package
        run: |
          name="ps2-toolchain-${GITHUB_REF_NAME#v}-windows-amd64"
          (cd "${{ runner.temp }}/staging" && zip -rq "$GITHUB_WORKSPACE/$name.zip" toolchain)
      - uses: softprops/action-gh-release@v2
        with:
          files: ps2-toolchain-*-windows-amd64.zip
